# SPDX-License-Identifier: MIT
#
# Minimal CI: build and test the configurations that matter.
#
#   native   the OS on x86 with AddressSanitizer + UBSan, and the layering
#            tripwire. This is where memory bugs are caught. Also builds and
#            tests RELEASE in the same job -- -O2 enables warnings -O0 cannot
#            produce, NDEBUG removes every assert(), and os_fits_in_rom only
#            runs unsanitized. Both facts have already caught something.
#   arm      the same OS as real Cortex-M3 machine code, booted through the
#            boot ROM on QEMU. This is where the memory map is enforced.
#   format   clang-format, at a PINNED version.
#   armv6m   the portable core compiled for Cortex-M0. Real SIM parts are not
#            all ARMv7-M -- Samsung's S3M228A uses an ARM SecurCore SC000,
#            which is ARMv6-M. See docs/hardware-port.md.
#   s3m228a  the OS linked against the do-nothing S3M228A stub. It proves the
#            HAL surface is genuinely bounded -- if the core ever grows a
#            dependency on something the stub does not provide, this fails to
#            link. That is the project's central architectural claim, checked
#            by a machine instead of by review.
#
# Every job that builds checks out the mbedTLS submodule shallowly. Without it
# the build stops with a FATAL_ERROR, which is the right behaviour -- a missing
# crypto backend must not be something a build silently works around -- but it
# means CI has to ask for it. `format` does not: it only touches
# src/include/tests/simulator and explicitly prunes third_party, because
# reformatting a vendored library would turn the submodule into a fork.
#
# Deliberately not here: caching, matrices, coverage, release artefacts. The
# whole suite runs in a couple of minutes; complexity in CI is complexity that
# fails for reasons unrelated to the code.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Runs first and fastest, so a formatting slip is reported in seconds rather
  # than after the QEMU job. It cannot fail for any reason except formatting.
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PINNED, via pip rather than apt. clang-format's output changes between
      # releases, so taking whatever the runner's distro ships means the check
      # starts failing whenever Ubuntu moves on -- for reasons that have
      # nothing to do with the code. The version here must match the one in
      # tools/check-format.sh.
      - name: Install clang-format 23.1.0
        run: pip install clang-format==23.1.0

      - name: Check formatting
        run: ./tools/check-format.sh

  native:
    name: native + sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mbedTLS is a submodule and the build refuses without it. Shallow:
          # only the pinned commit is needed, and the full history is ~50 MB.
          submodules: true
          fetch-depth: 1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # Includes the unit tests, the five fuzz targets, the core_no_host_deps
      # layering check, and the Python integration suite against the native
      # simulator.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Release in the SAME job rather than a sixth one, because it is two
      # short steps and the point is coverage, not parallelism.
      #
      # Not the same check as Debug, in two ways that have both already caught
      # something. -O2 enables warnings -O0 cannot produce, and NDEBUG removes
      # every assert() -- which is how a Release build that had never been
      # compiled turned out to be broken, with the fuzz targets' invariants
      # silently compiled away. And os_fits_in_rom only runs here: measuring
      # code size under ASan measures the sanitizer.
      - name: Configure Release
        run: |
          cmake -S . -B build-rel \
            -DCMAKE_BUILD_TYPE=Release -DSCOS_SANITIZE=OFF

      - name: Build and test Release
        run: |
          cmake --build build-rel -j"$(nproc)"
          ctest --test-dir build-rel --output-on-failure

  arm:
    name: ARM Cortex-M3 on QEMU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mbedTLS is a submodule and the build refuses without it. Shallow:
          # only the pinned commit is needed, and the full history is ~50 MB.
          submodules: true
          fetch-depth: 1

      - name: Install the cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi qemu-system-arm

      - name: Configure
        run: |
          cmake -S . -B build-arm \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-arm-scv1.cmake \
            -DCMAKE_BUILD_TYPE=Debug

      # The link itself is a test. scv1.ld fails the build if the OS outgrows
      # its 55 KB slot or if static data plus the reserved stack exceeds 16 KB
      # of SRAM; scv1_boot.ld does the same for the 8 KB mask ROM.
      - name: Build boot ROM and OS
        run: cmake --build build-arm -j"$(nproc)"

      - name: Report image sizes
        run: arm-none-eabi-size build-arm/scv1-boot.elf build-arm/smartcard-os.elf

      # Boots the boot ROM, which programs and starts the OS, then drives the
      # full Python suite over QEMU's UART -- the same tests the native job
      # runs, which makes them a conformance suite for the port rather than
      # something rewritten for it.
      - name: Test on QEMU
        run: ctest --test-dir build-arm --output-on-failure

  armv6m:
    name: ARMv6-M portability (Cortex-M0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mbedTLS is a submodule and the build refuses without it. Shallow:
          # only the pinned commit is needed, and the full history is ~50 MB.
          submodules: true
          fetch-depth: 1

      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi

      # Only to generate include/os/scos_config.h; nothing is built here.
      - name: Generate the config header
        run: cmake -S . -B build

      # Compile-only, and deliberately so: there is no ARMv6-M board target,
      # and faking one would be worse than an honest narrow check. What this
      # proves is that the PORTABLE core contains no ARMv7-M-only construct.
      # src/hal/arm-scv1/ is exempt -- a HAL is allowed to be architecture
      # specific, and boot_main.c writes SCB->VTOR, which Cortex-M0 lacks.
      - name: Compile the core for ARMv6-M
        run: ./tools/check-armv6m.sh

  s3m228a-stub:
    name: HAL boundary (S3M228A stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mbedTLS is a submodule and the build refuses without it. Shallow:
          # only the pinned commit is needed, and the full history is ~50 MB.
          submodules: true
          fetch-depth: 1

      # SCOS_ACK_S3M228A_STUB is required because src/hal/s3m228a/ contains no
      # part-specific code and every function fails at run time. It exists
      # to be linked against, not to work. See docs/hardware-port.md.
      - name: Configure with the unimplemented HAL
        run: |
          cmake -S . -B build-stub \
            -DSCOS_HAL=s3m228a \
            -DSCOS_ACK_S3M228A_STUB=ON \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-stub -j"$(nproc)"

      # Only the HAL-free tests run here: there is no working NVM behind the
      # stub, so the filesystem and integration tests are absent by design.
      - name: Test what does not need a HAL
        run: ctest --test-dir build-stub --output-on-failure
